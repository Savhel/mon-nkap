<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Mon Nkap · application mobile</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/assistant.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--nk-bg); color: var(--nk-ink); }
  .device { height: 100%; max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; background: var(--nk-card); }
  @media (min-width: 600px) {
    body { padding: 24px 0; background: var(--nk-soft); }
    .device { height: min(860px, calc(100vh - 48px)); border-radius: 28px; overflow: hidden; border: 1px solid var(--nk-line); box-shadow: 0 24px 64px rgba(2, 6, 23, .18); }
  }
  .appbar { display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; background: #0f172a; color: #fff; }
  .appbar svg { flex: none; }
  .appbar b { display: block; font-size: 17px; font-weight: 600; letter-spacing: .01em; }
  .appbar small { display: block; font-size: 13px; color: #cbd5e1; }
  #app { flex: 1; min-height: 0; }
</style>
</head>
<body>
<div class="device">
  <header class="appbar">
    <svg width="36" height="36" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#a16207"/><path d="M128 352V176l64 96 64-96 64 96 64-96v176" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><b>Mon Nkap</b><small>Votre argent, dans votre langue · démonstration, données fictives</small></div>
  </header>
  <main id="app"></main>
</div>
<script src="/sdk.js"></script>
<script src="/assistant.js"></script>
<script>
  MonNkapAssistant.mount(document.getElementById('app'), { channel: 'mobile', lang: new URLSearchParams(location.search).get('lang') || 'fr' });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
</script>
</body>
</html>
