<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Ma Banque · application mobile</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assistant.css">
<style>
  :root { --bg:#e9ece9; --accent:#0f766e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0d0e; } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .device { height:100%; max-width:430px; margin:0 auto; display:flex; flex-direction:column; background:#fff; }
  @media (min-width:600px) { body { padding:24px 0; } .device { height:min(860px, calc(100vh - 48px)); border-radius:28px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.25); } }
  .appbar { background:var(--accent); color:#fff; padding:14px 16px; }
  .appbar b { font-size:1.05rem; } .appbar small { display:block; opacity:.85; font-size:.8rem; }
  #app { flex:1; min-height:0; }
</style>
</head>
<body>
<div class="device">
  <div class="appbar"><b>Ma Banque</b><small>Application mobile simulée · l'assistant parle votre langue · données fictives</small></div>
  <div id="app"></div>
</div>
<script src="/sdk.js"></script>
<script src="/assistant.js"></script>
<script>
  CamerounAssistant.mount(document.getElementById('app'), { channel: 'mobile', lang: new URLSearchParams(location.search).get('lang') || 'fr' });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
</script>
</body>
</html>
