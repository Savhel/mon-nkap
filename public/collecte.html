<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Collecte · Mon Nkap</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--nk-bg); color: var(--nk-ink); }
  [hidden] { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--nk-focus); outline-offset: 2px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  header { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-bottom: 8px; }
  header img { width: 32px; height: 32px; }
  header h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; color: var(--nk-primary); }
  .lang { font-size: 14px; color: var(--nk-muted); }
  .card { background: var(--nk-card); border: 1px solid var(--nk-line); border-radius: var(--nk-radius); padding: 20px 16px; }
  h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.3; color: var(--nk-primary); }
  p { margin: 0 0 12px; }
  .muted { color: var(--nk-muted); font-size: 14px; }
  .field { display: block; font-weight: 600; margin: 16px 0 6px; }
  input[type=text], textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--nk-line); border-radius: var(--nk-radius-sm); background: var(--nk-bg); font-size: 17px; }
  input.code { text-transform: uppercase; letter-spacing: .12em; font-family: var(--nk-mono); }
  textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
  .check { display: flex; gap: 12px; align-items: flex-start; margin: 16px 0; font-size: 15px; cursor: pointer; }
  .check input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--nk-secondary); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border: 0; border-radius: var(--nk-radius-sm); background: var(--nk-accent); color: var(--nk-on-accent); font-weight: 600; cursor: pointer; }
  .btn:disabled { opacity: .5; }
  .link { border: 0; background: none; color: var(--nk-secondary); font-weight: 500; padding: 8px 4px; min-height: 44px; cursor: pointer; }
  .alert { margin-top: 12px; padding: 12px 14px; border-radius: var(--nk-radius-sm); border: 1px solid var(--nk-line); background: var(--nk-soft); font-size: 15px; }
  .alert.bad { border-color: var(--nk-bad); color: var(--nk-bad); }
  .alert.ok { border-color: var(--nk-ok); color: var(--nk-ok); }

  .sections { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; }
  .sections button { flex: none; min-height: 44px; padding: 0 14px; border: 1px solid var(--nk-line); border-radius: 999px; background: var(--nk-card); font-size: 15px; cursor: pointer; }
  .sections button[aria-pressed="true"] { border-color: var(--nk-secondary); background: var(--nk-secondary); color: var(--nk-on-secondary); font-weight: 600; }
  .sections small { opacity: .8; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .progress { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--nk-muted); font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 4px; background: var(--nk-soft); overflow: hidden; margin: 4px 0 16px; }
  .bar span { display: block; height: 100%; background: var(--nk-ok); transition: width var(--nk-base) var(--nk-ease); }
  .ref { margin: 12px 0 0; padding: 12px 14px; border-left: 3px solid var(--nk-secondary); background: var(--nk-soft); border-radius: 0 var(--nk-radius-sm) var(--nk-radius-sm) 0; font-size: 16px; }
  .ref b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--nk-muted); margin-bottom: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips button { min-height: 36px; padding: 0 10px; border: 1px dashed var(--nk-secondary); border-radius: 6px; background: transparent; color: var(--nk-secondary); font-family: var(--nk-mono); font-size: 14px; cursor: pointer; }
  .done { display: block; margin-top: 10px; font-size: 14px; color: var(--nk-ok); font-weight: 600; }

  .rec { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .mic { width: 64px; height: 64px; flex: none; border-radius: 50%; border: 0; background: var(--nk-secondary); color: var(--nk-on-secondary); display: grid; place-items: center; cursor: pointer; }
  .mic[aria-pressed="true"] { background: var(--nk-bad); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--nk-bad) 25%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .mic[aria-pressed="true"] { animation: none; } }
  .rec-state { flex: 1; min-width: 160px; font-size: 15px; }
  .rec-state time { font-variant-numeric: tabular-nums; font-weight: 600; }
  audio { width: 100%; margin-top: 10px; }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .actions .btn { flex: 1; }
  footer { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/icon.svg" alt="">
    <h1>Mon Nkap · Collecte</h1>
    <span class="lang" id="lang-label"></span>
  </header>

  <!-- 1. Entrée par invitation -->
  <section class="card" id="screen-code">
    <h2>Aidez-nous à parler votre langue</h2>
    <p>Cette page est réservée aux personnes invitées. Entrez le code que l’équipe Mon Nkap vous a donné.</p>
    <form id="code-form" novalidate>
      <label class="field" for="code">Code d’invitation</label>
      <input type="text" class="code" id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" maxlength="20" required>
      <label class="check"><input type="checkbox" id="consent"> <span>J’accepte que mes phrases et ma voix servent à apprendre le service Mon Nkap dans ma langue. Mon nom n’est pas enregistré. Je peux arrêter à tout moment.</span></label>
      <button class="btn" type="submit" id="code-btn" style="width:100%">Commencer</button>
      <div class="alert bad" id="code-err" role="alert" hidden></div>
    </form>
  </section>

  <!-- 2. Collecte, un élément à la fois -->
  <section id="screen-work" hidden>
    <div class="sections" id="sections" role="group" aria-label="Parties de la collecte"></div>
    <div class="progress"><span id="progress-text"></span><button class="link" type="button" id="skip">Passer</button></div>
    <div class="bar" aria-hidden="true"><span id="bar" style="width:0"></span></div>

    <article class="card" id="task">
      <h2 id="task-title"></h2>
      <div class="ref" id="task-ref" hidden><b>En français</b><span id="task-ref-text"></span></div>
      <div class="chips" id="task-chips" hidden></div>
      <span class="done" id="task-done" hidden></span>

      <label class="field" for="texte">Écrivez-le comme vous le dites</label>
      <textarea id="texte" maxlength="500" spellcheck="false" placeholder="Dans votre langue, avec vos accents"></textarea>

      <span class="field">Ou dites-le à voix haute</span>
      <div class="rec">
        <button class="mic" type="button" id="mic" aria-pressed="false" aria-label="Enregistrer">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <div class="rec-state" id="rec-state" aria-live="polite"></div>
      </div>
      <audio id="playback" controls hidden></audio>
      <button class="link" type="button" id="rec-clear" hidden>Effacer l’enregistrement</button>

      <div class="actions">
        <button class="btn" type="button" id="send">Envoyer</button>
      </div>
      <div class="alert" id="send-msg" role="status" hidden></div>
    </article>

    <footer>
      <span class="muted">Vos envois sont relus par l’équipe avant d’être utilisés.</span>
      <button class="link" type="button" id="logout">Quitter</button>
    </footer>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const KEY = 'mon_nkap_collecte_code';
  const store = {
    get() { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } },
    set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} },
  };
  const SECTION_NAMES = { demandes: 'Demandes', reponses: 'Réponses', definitions: 'Explications', nombres: 'Nombres', lexique: 'Mots' };
  const REC_HINT = 'Appuyez une fois pour commencer, une fois pour arrêter (30 secondes au plus).';
  let code = store.get(), state = null, section = 'demandes', index = 0;
  let recorder = null, chunks = [], blob = null, timer = null, started = 0;

  async function call(path, init = {}) {
    const res = await fetch(path, { ...init, headers: { 'content-type': 'application/json', 'x-collecte-code': code } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.message || data.error || `Erreur ${res.status}`), { status: res.status });
    return data;
  }

  // ---------------------------------------------------------------- entrée sur invitation
  $('code-form').onsubmit = async (e) => {
    e.preventDefault();
    $('code-err').hidden = true;
    if (!$('consent').checked) { $('code-err').textContent = 'Cochez la case d’accord pour continuer.'; $('code-err').hidden = false; return; }
    code = $('code').value.trim();
    $('code-btn').disabled = true;
    try { await start(); store.set(code); }
    catch (err) {
      code = '';
      $('code-err').textContent = err.status === 401 ? 'Ce code n’est pas valable. Vérifiez-le auprès de l’équipe.' : err.message;
      $('code-err').hidden = false;
    } finally { $('code-btn').disabled = false; }
  };
  $('logout').onclick = () => {
    stopRecording(true); store.set(''); code = ''; state = null;
    $('screen-work').hidden = true; $('screen-code').hidden = false; $('lang-label').textContent = ''; $('code').value = '';
  };

  async function start() {
    state = await call('/v1/collecte/tasks');
    $('lang-label').textContent = state.langue;
    $('texte').lang = state.lang;
    $('screen-code').hidden = true; $('screen-work').hidden = false;
    index = Math.max(0, ofSection().findIndex((t) => !t.envoyes));
    renderSections(); render();
  }

  // ---------------------------------------------------------------- navigation
  const ofSection = () => state.tasks.filter((t) => t.section === section);
  function renderSections() {
    const box = $('sections'); box.replaceChildren();
    for (const [id, name] of Object.entries(SECTION_NAMES)) {
      const list = state.tasks.filter((t) => t.section === id);
      const b = document.createElement('button'); b.type = 'button';
      b.setAttribute('aria-pressed', String(id === section));
      const s = document.createElement('small'); s.textContent = `${list.filter((t) => t.envoyes).length}/${list.length}`;
      b.append(name, s);
      b.onclick = () => { section = id; index = Math.max(0, ofSection().findIndex((t) => !t.envoyes)); $('send-msg').hidden = true; renderSections(); render(); box.querySelector('[aria-pressed="true"]')?.scrollIntoView({ inline: 'nearest', block: 'nearest' }); };
      box.append(b);
    }
  }

  function render() {
    const list = ofSection(), t = list[index];
    const done = list.filter((x) => x.envoyes).length;
    $('progress-text').textContent = `${index + 1} sur ${list.length} · ${done} envoyé${done > 1 ? 's' : ''}`;
    $('bar').style.width = `${Math.round(100 * done / list.length)}%`;
    $('task-title').textContent = t.consigne;
    $('task-ref').hidden = !t.exemple || t.section === 'nombres';
    $('task-ref-text').textContent = t.exemple || '';
    const chips = $('task-chips'); chips.replaceChildren();
    chips.hidden = !(t.reperes && t.reperes.length);
    for (const r of t.reperes || []) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = r; b.title = 'Ajouter ce repère au texte';
      b.onclick = () => {
        const ta = $('texte'), from = ta.selectionStart ?? ta.value.length, to = ta.selectionEnd ?? from;
        ta.value = ta.value.slice(0, from) + r + ta.value.slice(to); ta.focus(); ta.selectionStart = ta.selectionEnd = from + r.length;
      };
      chips.append(b);
    }
    $('task-done').hidden = !t.envoyes;
    $('task-done').textContent = t.envoyes ? `Déjà envoyé (${t.envoyes}). Une autre façon de le dire est la bienvenue.` : '';
    $('texte').value = '';
    $('texte').placeholder = t.reperes && t.reperes.length ? 'Gardez les repères entre accolades, par exemple {montant}' : 'Dans votre langue, avec vos accents';
    clearRecording();
  }
  function next() { index = (index + 1) % ofSection().length; render(); $('send-msg').hidden = true; window.scrollTo({ top: 0, behavior: 'smooth' }); }
  $('skip').onclick = next;

  // ---------------------------------------------------------------- micro
  const pickMime = () => ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/webm'].find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
  function clearRecording() {
    blob = null; $('playback').hidden = true; $('playback').removeAttribute('src'); $('rec-clear').hidden = true;
    $('rec-state').textContent = REC_HINT;
  }
  $('rec-clear').onclick = clearRecording;
  function stopRecording(discard) {
    clearInterval(timer); timer = null;
    if (recorder && recorder.state !== 'inactive') { recorder.discard = !!discard; recorder.stop(); }
  }
  $('mic').onclick = async () => {
    if (recorder && recorder.state === 'recording') return stopRecording(false);
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { $('rec-state').textContent = 'Ce navigateur ne permet pas d’enregistrer. Écrivez la phrase.'; return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch { $('rec-state').textContent = 'Micro refusé. Autorisez le micro dans le navigateur, ou écrivez la phrase.'; return; }
    const mime = pickMime();
    const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); recorder = rec; chunks = [];
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      $('mic').setAttribute('aria-pressed', 'false'); $('mic').setAttribute('aria-label', 'Enregistrer');
      if (rec.discard) return;
      blob = new Blob(chunks, { type: rec.mimeType || mime || 'audio/webm' });
      $('playback').src = URL.createObjectURL(blob); $('playback').hidden = false; $('rec-clear').hidden = false;
      $('rec-state').textContent = 'Écoutez votre enregistrement, puis envoyez-le. Vous pouvez aussi recommencer.';
    };
    rec.start(); started = Date.now();
    $('mic').setAttribute('aria-pressed', 'true'); $('mic').setAttribute('aria-label', 'Arrêter l’enregistrement');
    const tick = () => {
      const s = Math.floor((Date.now() - started) / 1000);
      const time = document.createElement('time'); time.textContent = `0:${String(Math.min(s, 30)).padStart(2, '0')}`;
      $('rec-state').replaceChildren('Enregistrement ', time, '. Appuyez pour arrêter.');
      if (s >= 30) stopRecording(false);
    };
    tick(); timer = setInterval(tick, 250);
  };

  const toBase64 = (b) => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ko; r.readAsDataURL(b); });

  // ---------------------------------------------------------------- envoi
  $('send').onclick = async () => {
    const t = ofSection()[index], texte = $('texte').value.trim(), msg = $('send-msg');
    msg.className = 'alert'; msg.hidden = true;
    if (recorder && recorder.state === 'recording') { msg.textContent = 'Arrêtez d’abord l’enregistrement.'; msg.hidden = false; return; }
    if (!texte && !blob) { msg.textContent = 'Écrivez la phrase ou enregistrez-la avant d’envoyer.'; msg.hidden = false; return; }
    $('send').disabled = true; $('send').textContent = 'Envoi…';
    try {
      const audio = blob ? { mime: blob.type, data: await toBase64(blob) } : undefined;
      await call('/v1/collecte/contribution', { method: 'POST', body: JSON.stringify({ section: t.section, item: t.item, texte, consent: true, audio }) });
      t.envoyes = (t.envoyes || 0) + 1;
      renderSections(); next();
      msg.className = 'alert ok'; msg.textContent = 'Merci, c’est envoyé. Voici la suivante.'; msg.hidden = false;
    } catch (err) {
      if (err.status === 401) { $('logout').click(); $('code-err').textContent = 'Votre invitation n’est plus valable. Contactez l’équipe.'; $('code-err').hidden = false; return; }
      msg.className = 'alert bad'; msg.textContent = err.message; msg.hidden = false;
    } finally { $('send').disabled = false; $('send').textContent = 'Envoyer'; }
  };

  if (code) { $('consent').checked = true; start().catch(() => { store.set(''); code = ''; }); }
})();
</script>
</body>
</html>
