<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Options · Extension Mon Nkap</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #0f172a; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; color: #475569; }
  input[type="text"], input[type="password"] { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
  button { margin-top: 16px; font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 8px; background: #a16207; color: #fff; cursor: pointer; }
  .msg { margin-top: 12px; font-size: 13px; }
</style>
</head>
<body>
<h1>Configuration · Extension Mon Nkap</h1>
<form id="f">
  <label for="srv">URL du serveur Mon Nkap</label>
  <input id="srv" type="text" placeholder="http://localhost:8080">
  <label for="key">Clé API entreprise (x-api-key)</label>
  <input id="key" type="password" placeholder="nk_live_…">
  <label><input id="draft" type="checkbox"> Autoriser les libellés brouillons Mboa (allowDraft)</label>
  <button type="submit">Enregistrer</button>
</form>
<div class="msg" id="msg"></div>
<script src="options.js"></script>
</body>
</html>
