<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mon Nkap · Assistant Bancaire</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, sans-serif; background: #f8fafc; color: #020617; display: flex; flex-direction: column; height: 100vh; }
  header { background: #0f172a; color: #fff; padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header h1 { margin: 0; font-size: 15px; }
  header a { color: #facc15; font-size: 12px; text-decoration: none; }
  .bar { padding: 10px 12px; background: #fff; border-bottom: 1px solid #e2e8f0; display: grid; gap: 8px; }
  .row { display: flex; gap: 6px; align-items: center; }
  select, input { flex: 1; font: inherit; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; }
  button { font: inherit; font-weight: 600; padding: 8px 12px; border: 0; border-radius: 8px; cursor: pointer; background: #a16207; color: #fff; }
  button.sec { background: #e2e8f0; color: #0f172a; }
  .log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 9px 11px; border-radius: 10px; max-width: 92%; white-space: pre-wrap; }
  .me { align-self: flex-end; background: #1e3a8a; color: #fff; }
  .bot { align-self: flex-start; background: #fff; border: 1px solid #e2e8f0; }
  .meta { display: block; font-size: 11px; color: #64748b; margin-top: 4px; }
  .actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  form { padding: 10px 12px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; gap: 6px; }
  .status { font-size: 12px; color: #475569; }
</style>
</head>
<body>
<header>
  <h1>Mon Nkap</h1>
  <a href="options.html" target="_blank">Réglages API</a>
</header>
<div class="bar">
  <div class="row">
    <select id="lang"></select>
    <button type="button" id="loc-btn">Traduire la page</button>
    <button type="button" class="sec" id="rst-btn">FR</button>
  </div>
  <div class="status" id="status">Prêt.</div>
</div>
<div class="log" id="log"></div>
<form id="form">
  <input id="input" placeholder="Ex. Quel est mon solde ? / Envoie 5000 à Marie" autocomplete="off">
  <button type="submit">Envoyer</button>
</form>
<script src="sidepanel.js"></script>
</body>
</html>
