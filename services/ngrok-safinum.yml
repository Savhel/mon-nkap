# Tunnel public : seulement le middleware SAFINUM et la page de collecte des natifs (protégée par code d'invitation).
# Tout autre chemin répond 404 depuis Internet (voix PlotWeaver, administration et API restent locales).
# Usage : ngrok http 8080 --traffic-policy-file services/ngrok-safinum.yml
on_http_request:
  - expressions:
      - "!(req.url.path == '/safinum/middleware' || req.url.path == '/collecte' || req.url.path.startsWith('/v1/collecte/') || req.url.path == '/tokens.css' || req.url.path == '/icon.svg')"
    actions:
      - type: custom-response
        config:
          status_code: 404
          body: "introuvable"
